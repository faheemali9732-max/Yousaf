<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0B1120"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4A373"/>
      <stop offset="100%" stop-color="#C68B59"/>
    </linearGradient>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B18"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="500" height="500" fill="url(#bgGrad)" />
  
  <!-- Tech Grid Accent -->
  <circle cx="250" cy="250" r="220" fill="none" stroke="#2563EB" stroke-width="2" stroke-dasharray="8 8" opacity="0.4" />
  <circle cx="250" cy="250" r="190" fill="none" stroke="#38BDF8" stroke-width="1.5" opacity="0.3" />
  <circle cx="250" cy="250" r="160" fill="none" stroke="#60A5FA" stroke-width="1" stroke-dasharray="4 4" opacity="0.25" />

  <!-- Abstract Tech Ambient Glow Behind Subject -->
  <circle cx="250" cy="220" r="110" fill="#2563EB" opacity="0.25" filter="url(#glow)"/>

  <!-- Male Professional Figure (Muhammad Yousaf) -->
  <g transform="translate(0, 20)">
    <!-- Shoulders / Blazer -->
    <path d="M120 440 C120 350, 160 320, 220 310 L250 350 L280 310 C340 320, 380 350, 380 440 Z" fill="url(#suitGrad)" stroke="#334155" stroke-width="2"/>
    
    <!-- Shirt Collar & Tie -->
    <polygon points="250,320 225,350 250,420 275,350" fill="#F8FAFC" />
    <polygon points="245,350 255,350 258,430 242,430" fill="url(#accentGrad)" />
    
    <!-- Neck -->
    <rect x="225" y="250" width="50" height="70" rx="10" fill="url(#skinGrad)" />
    <!-- Neck Shadow -->
    <path d="M225 285 Q250 305 275 285 L275 300 L225 300 Z" fill="#A26D3F" opacity="0.4" />

    <!-- Head & Ears -->
    <circle cx="178" cy="200" r="14" fill="url(#skinGrad)" />
    <circle cx="322" cy="200" r="14" fill="url(#skinGrad)" />
    <ellipse cx="250" cy="195" rx="64" ry="76" fill="url(#skinGrad)" />

    <!-- Modern Male Haircut -->
    <path d="M184 185 C180 130, 210 105, 250 105 C290 105, 320 125, 316 185 C310 160, 290 135, 250 135 C210 135, 190 160, 184 185 Z" fill="url(#hairGrad)" />
    <path d="M185 160 Q200 120 250 115 Q300 120 315 155 Q300 130 250 130 Q200 130 185 160 Z" fill="#2563EB" opacity="0.3"/>

    <!-- Eyebrows -->
    <path d="M205 175 Q225 170 235 175" stroke="#1E1B18" stroke-width="4.5" stroke-linecap="round" fill="none" />
    <path d="M265 175 Q275 170 295 175" stroke="#1E1B18" stroke-width="4.5" stroke-linecap="round" fill="none" />

    <!-- Eyes -->
    <circle cx="220" cy="190" r="5.5" fill="#1E293B" />
    <circle cx="280" cy="190" r="5.5" fill="#1E293B" />
    <circle cx="222" cy="188" r="2" fill="#FFFFFF" />
    <circle cx="282" cy="188" r="2" fill="#FFFFFF" />

    <!-- Glasses (Tech / Professional aesthetic) -->
    <rect x="200" y="178" width="40" height="26" rx="6" fill="none" stroke="#38BDF8" stroke-width="3" opacity="0.9"/>
    <rect x="260" y="178" width="40" height="26" rx="6" fill="none" stroke="#38BDF8" stroke-width="3" opacity="0.9"/>
    <line x1="240" y1="188" x2="260" y2="188" stroke="#38BDF8" stroke-width="3" />
    <line x1="185" y1="186" x2="200" y2="186" stroke="#38BDF8" stroke-width="2.5" />
    <line x1="300" y1="186" x2="315" y2="186" stroke="#38BDF8" stroke-width="2.5" />

    <!-- Nose -->
    <path d="M250 188 L247 215 L255 215" stroke="#A26D3F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Confident Smile -->
    <path d="M232 235 Q250 248 268 235" stroke="#845028" stroke-width="3.5" stroke-linecap="round" fill="none" />

    <!-- Well-groomed short beard / jawline accent -->
    <path d="M194 205 Q250 278 306 205 Q285 272 250 272 Q215 272 194 205 Z" fill="#1E1B18" opacity="0.35" />
  </g>

  <!-- Tech Code Symbols Accent overlay -->
  <text x="50" y="80" fill="#38BDF8" font-family="monospace" font-size="18" opacity="0.4">&lt;code&gt;</text>
  <text x="390" y="440" fill="#38BDF8" font-family="monospace" font-size="18" opacity="0.4">&lt;/code&gt;</text>
  <text x="390" y="90" fill="#2563EB" font-family="monospace" font-size="16" opacity="0.5">01001001 01010100</text>
  <text x="40" y="430" fill="#60A5FA" font-family="monospace" font-size="16" opacity="0.5">{ BS: "IT" }</text>

  <!-- Border Badge -->
  <rect x="15" y="15" width="470" height="470" rx="20" fill="none" stroke="url(#accentGrad)" stroke-width="2" opacity="0.4"/>
</svg>
